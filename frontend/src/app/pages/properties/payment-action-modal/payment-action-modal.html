@if (open()) {
  <div class="fixed inset-0 z-40 flex items-center justify-center bg-slate-navy/40 p-4" (click)="close()">
    <div
      class="flex max-h-[90vh] w-full max-w-md flex-col gap-6 overflow-y-auto rounded-xl bg-surface-card p-6 shadow-xl"
      role="dialog"
      [attr.aria-label]="'payments.action.title' | translate"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between border-b border-slate-navy/10 pb-4">
        <h2 class="text-xl font-bold text-slate-navy">{{ 'payments.action.title' | translate }}</h2>
        <button
          type="button"
          (click)="close()"
          [attr.aria-label]="'payments.action.close' | translate"
          class="tap-target rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
        >
          &times;
        </button>
      </div>

      <form [formGroup]="form" class="flex flex-col gap-4" (ngSubmit)="save()" novalidate>
        <fieldset class="flex flex-col gap-2">
          <legend class="text-sm font-medium text-slate-navy">{{ 'payments.action.whatHappened' | translate }}</legend>
          <label class="flex items-center gap-2 text-sm text-slate-navy">
            <input
              type="radio"
              formControlName="actionType"
              value="reverse"
              class="tap-target focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
            />
            {{ 'payments.action.reverse' | translate }}
          </label>
          <label class="flex items-center gap-2 text-sm text-slate-navy">
            <input
              type="radio"
              formControlName="actionType"
              value="reallocate"
              (change)="onTargetPropertyChange()"
              class="tap-target focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
            />
            {{ 'payments.action.reallocate' | translate }}
          </label>
        </fieldset>

        @if (form.controls.actionType.value === 'reallocate') {
          <div class="flex flex-col gap-1.5">
            <label for="targetPropertyId" class="text-sm font-medium text-slate-navy">{{ 'payments.action.targetProperty' | translate }}</label>
            <select
              id="targetPropertyId"
              formControlName="targetPropertyId"
              (change)="onTargetPropertyChange()"
              class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
            >
              <option value="" disabled>{{ 'payments.action.targetPropertyPlaceholder' | translate }}</option>
              @for (property of properties(); track property.id) {
                <option [value]="property.id">{{ property.name }}@if (property.unitIdentifier) {, {{ property.unitIdentifier }}}</option>
              }
            </select>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="targetResidentProfileId" class="text-sm font-medium text-slate-navy">{{ 'payments.action.targetResident' | translate }}</label>
            <select
              id="targetResidentProfileId"
              formControlName="targetResidentProfileId"
              class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
            >
              <option value="" disabled>{{ 'payments.form.paidByPlaceholder' | translate }}</option>
              @for (resident of targetResidents(); track resident.id) {
                <option [value]="resident.id">{{ resident.firstName }} {{ resident.lastName }}</option>
              }
            </select>
          </div>
        }

        <div class="flex flex-col gap-1.5">
          <label for="reversalReason" class="text-sm font-medium text-slate-navy">{{ 'payments.action.reason' | translate }}</label>
          <textarea
            id="reversalReason"
            rows="2"
            formControlName="reversalReason"
            [attr.aria-invalid]="form.controls.reversalReason.invalid && form.controls.reversalReason.touched"
            class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
          ></textarea>
        </div>

        <div class="flex justify-end gap-3 border-t border-slate-navy/10 pt-4">
          <button
            type="button"
            (click)="close()"
            class="tap-target rounded-md border border-slate-navy/20 px-4 py-2 font-semibold text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
          >
            {{ 'charges.form.cancel' | translate }}
          </button>
          <button
            type="submit"
            [disabled]="submitting()"
            class="tap-target rounded-md bg-slate-navy px-4 py-2 font-semibold text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald disabled:opacity-60"
          >
            {{ (submitting() ? 'charges.form.saving' : 'payments.action.save') | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
