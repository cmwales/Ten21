<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-semibold text-slate-navy">{{ 'properties.form.unitsHeading' | translate }}</h2>
    <button
      type="button"
      (click)="addUnit.emit()"
      class="tap-target rounded-md border border-emerald px-3 py-1.5 text-sm font-medium text-emerald focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
    >
      {{ 'properties.form.addUnit' | translate }}
    </button>
  </div>

  @if (unitsArray.length === 0) {
    <p class="text-sm text-slate-navy-light">{{ 'properties.form.noUnits' | translate }}</p>
  }

  @for (unitGroup of unitsArray.controls; track unitGroup; let i = $index) {
    <div [formGroup]="unitGroup" class="grid grid-cols-1 gap-3 rounded-md border border-slate-navy/10 p-4 sm:grid-cols-[2fr_1fr_1fr_auto]">
      <div class="flex flex-col gap-1.5">
        <label [for]="'unitIdentifier-' + i" class="text-sm font-medium text-slate-navy">
          {{ 'properties.form.unitIdentifier' | translate }}
        </label>
        <input
          [id]="'unitIdentifier-' + i"
          type="text"
          formControlName="unitIdentifier"
          [attr.aria-invalid]="unitGroup.controls.unitIdentifier.invalid && unitGroup.controls.unitIdentifier.touched"
          class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label [for]="'targetRent-' + i" class="text-sm font-medium text-slate-navy">
          {{ 'properties.form.targetRent' | translate }}
        </label>
        <input
          [id]="'targetRent-' + i"
          type="number"
          min="0"
          step="0.01"
          formControlName="targetRent"
          class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label [for]="'occupancyStatus-' + i" class="text-sm font-medium text-slate-navy">
          {{ 'properties.form.occupancyStatus' | translate }}
        </label>
        <select
          [id]="'occupancyStatus-' + i"
          formControlName="occupancyStatus"
          class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
        >
          @for (status of occupancyStatuses; track status) {
            <option [value]="status">{{ 'properties.occupancyStatuses.' + status | translate }}</option>
          }
        </select>
      </div>

      <div class="flex items-end">
        <button
          type="button"
          (click)="removeUnit.emit(i)"
          [attr.aria-label]="'properties.form.removeUnit' | translate"
          class="tap-target rounded-md border border-rose px-3 py-2 text-sm font-medium text-rose focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose"
        >
          {{ 'properties.form.removeUnit' | translate }}
        </button>
      </div>
    </div>
  }
</div>
