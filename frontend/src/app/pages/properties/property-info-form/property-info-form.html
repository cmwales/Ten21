<div [formGroup]="form" class="flex flex-col gap-5">
  <app-form-field controlId="name" labelKey="properties.form.name" [control]="form.controls.name" errorKey="properties.form.nameRequired">
    <input
      id="name"
      type="text"
      formControlName="name"
      [attr.aria-invalid]="form.controls.name.invalid && form.controls.name.touched"
      class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
    />
  </app-form-field>

  <app-form-field controlId="propertyType" labelKey="properties.form.propertyType" [control]="form.controls.propertyType">
    <select
      id="propertyType"
      formControlName="propertyType"
      class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
    >
      @for (type of propertyTypes; track type) {
        <option [value]="type">{{ 'properties.propertyTypes.' + type | translate }}</option>
      }
    </select>
  </app-form-field>

  <app-form-field controlId="streetAddress1" labelKey="properties.form.streetAddress1" [control]="form.controls.streetAddress1" errorKey="properties.form.streetAddress1Required">
    <input
      id="streetAddress1"
      type="text"
      formControlName="streetAddress1"
      [attr.aria-invalid]="form.controls.streetAddress1.invalid && form.controls.streetAddress1.touched"
      class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
    />
  </app-form-field>

  <app-form-field controlId="streetAddress2" labelKey="properties.form.streetAddress2" [control]="form.controls.streetAddress2">
    <input
      id="streetAddress2"
      type="text"
      formControlName="streetAddress2"
      class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
    />
  </app-form-field>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <app-form-field controlId="city" labelKey="properties.form.city" [control]="form.controls.city" errorKey="properties.form.cityRequired">
      <input
        id="city"
        type="text"
        formControlName="city"
        [attr.aria-invalid]="form.controls.city.invalid && form.controls.city.touched"
        class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
      />
    </app-form-field>

    <app-form-field controlId="state" labelKey="properties.form.state" [control]="form.controls.state" errorKey="properties.form.stateRequired">
      <input
        id="state"
        type="text"
        formControlName="state"
        [attr.aria-invalid]="form.controls.state.invalid && form.controls.state.touched"
        class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
      />
    </app-form-field>

    <app-form-field controlId="postalCode" labelKey="properties.form.postalCode" [control]="form.controls.postalCode" errorKey="properties.form.postalCodeRequired">
      <input
        id="postalCode"
        type="text"
        formControlName="postalCode"
        [attr.aria-invalid]="form.controls.postalCode.invalid && form.controls.postalCode.touched"
        class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
      />
    </app-form-field>

    <app-form-field controlId="country" labelKey="properties.form.country" [control]="form.controls.country" errorKey="properties.form.countryRequired">
      <input
        id="country"
        type="text"
        formControlName="country"
        [attr.aria-invalid]="form.controls.country.invalid && form.controls.country.touched"
        class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
      />
    </app-form-field>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <app-form-field
      controlId="unitIdentifier"
      labelKey="properties.form.unitIdentifier"
      [control]="form.controls.unitIdentifier"
      errorKey="properties.form.unitIdentifierMaxLength"
      hintKey="properties.form.unitIdentifierHint"
    >
      <input
        id="unitIdentifier"
        type="text"
        formControlName="unitIdentifier"
        maxlength="50"
        [placeholder]="'properties.form.unitIdentifierPlaceholder' | translate"
        [attr.aria-invalid]="form.controls.unitIdentifier.invalid && form.controls.unitIdentifier.touched"
        class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
      />
    </app-form-field>

    <app-form-field controlId="targetRent" labelKey="properties.form.targetRent" [control]="form.controls.targetRent">
      <input
        id="targetRent"
        type="number"
        min="0"
        step="0.01"
        formControlName="targetRent"
        class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
      />
    </app-form-field>

    <app-form-field controlId="occupancyStatus" labelKey="properties.form.occupancyStatus" [control]="form.controls.occupancyStatus">
      <select
        id="occupancyStatus"
        formControlName="occupancyStatus"
        class="tap-target w-full rounded-md border border-slate-navy/20 px-3 py-2 text-slate-navy focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
      >
        @for (status of occupancyStatuses; track status) {
          <option [value]="status">{{ 'properties.occupancyStatuses.' + status | translate }}</option>
        }
      </select>
    </app-form-field>
  </div>
</div>
