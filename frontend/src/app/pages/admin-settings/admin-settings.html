<div class="flex min-h-screen flex-col bg-slate-navy">
  <app-header />

  <main class="flex flex-1 justify-center px-4 py-8">
    <div class="w-full max-w-2xl">
      <h1 class="text-2xl font-bold text-white">{{ 'admin.settings.title' | translate }}</h1>

      @if (errorKey()) {
        <div role="alert" class="mt-6 rounded-md border border-rose bg-rose/10 px-4 py-3 text-sm font-medium text-rose">
          {{ errorKey()! | translate }}
        </div>
      }

      @if (loading()) {
        <p class="mt-6 text-sm text-white">{{ 'common.loading' | translate }}</p>
      } @else if (settings()) {
        <div class="mt-6 rounded-xl bg-surface-card p-6 shadow-xl">
          <h2 class="text-lg font-semibold text-slate-navy">{{ 'admin.settings.communityDirectorySectionTitle' | translate }}</h2>

          <label class="mt-4 flex items-start gap-3">
            <input
              type="checkbox"
              [checked]="enableCommunityDirectory()"
              (change)="enableCommunityDirectory.set(!enableCommunityDirectory())"
              class="tap-target mt-0.5 h-5 w-5 rounded border-slate-navy/30 text-emerald focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald"
            />
            <span>
              <span class="block font-medium text-slate-navy">{{ 'admin.settings.enableCommunityDirectory' | translate }}</span>
              <span class="mt-1 block text-sm text-slate-navy-light">{{ 'admin.settings.enableCommunityDirectoryHint' | translate }}</span>
            </span>
          </label>

          <div class="mt-6 flex justify-end border-t border-slate-navy/10 pt-4">
            <button
              type="button"
              (click)="save()"
              [disabled]="saving()"
              class="tap-target rounded-md bg-emerald px-4 py-2 font-semibold text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald disabled:opacity-60"
            >
              {{ (saving() ? 'admin.settings.saving' : 'admin.settings.save') | translate }}
            </button>
          </div>
        </div>
      }
    </div>
  </main>
</div>
