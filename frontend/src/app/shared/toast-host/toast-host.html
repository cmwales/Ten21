<div class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      role="status"
      class="pointer-events-auto w-full max-w-sm rounded-md bg-slate-navy px-4 py-3 text-sm font-medium text-white shadow-lg"
    >
      {{ toast.messageKey | translate }}
    </div>
  }
</div>
