<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ten21</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- US-18: loaded globally (not per-page) since Turnstile's own script is what the
       widget on the register page renders against. render=explicit + the onload callback
       let TurnstileLoader (core/turnstile/turnstile.ts) know precisely when
       window.turnstile is ready, rather than guessing at a timeout. -->
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=__ten21TurnstileReady&render=explicit"
    async
    defer
  ></script>
  <!-- US-15: Google Identity Services. Safe to load unconditionally even before a real
       Google:ClientId/GOOGLE_CLIENT_ID is configured -- GoogleSignInButton simply never
       calls initialize()/renderButton() until GOOGLE_CLIENT_ID is non-empty. Unlike
       Turnstile's api.js, GIS doesn't document an ?onload= query param, so readiness uses
       the script tag's own standard DOM load event instead. -->
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.__ten21GoogleReady && window.__ten21GoogleReady()"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
